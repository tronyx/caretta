# A production-like workload for testing Caretta and Radar: the OpenTelemetry Demo ("Astronomy Shop"),
# about 15 services in 10 languages talking gRPC and HTTP through an Envoy edge proxy, with Kafka,
# PostgreSQL, a Valkey cache, feature flags (flagd) and a load generator. Sized to fit a single kind node
# next to Caretta: the AI agent and chatbot (which need an LLM API key), the docs site and the bundled
# observability backends (Jaeger, Prometheus, Grafana, OpenSearch) are off, and the collector's
# telemetry goes to its debug exporter.
#
# Usage:
#   helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
#   helm install astronomy-shop open-telemetry/opentelemetry-demo --version 0.42.3 \
#     --namespace astronomy-shop --create-namespace -f examples/astronomy-shop-values.yaml
#   kubectl -n astronomy-shop port-forward svc/frontend-proxy 8090:8080   # the shop: http://localhost:8090
#                                                                          # load generator: /loadgen/
#                                                                          # feature flags: /feature/
#
# Cleanup:
#   helm uninstall astronomy-shop -n astronomy-shop && kubectl delete namespace astronomy-shop

jaeger:
  enabled: false
prometheus:
  enabled: false
grafana:
  enabled: false
opensearch:
  enabled: false

opentelemetry-collector:
  resources:
    requests:
      cpu: 30m
    limits:
      cpu: 500m
  config:
    service:
      pipelines:
        traces:
          exporters: [debug, span_metrics]
        metrics:
          exporters: [debug]
        logs:
          exporters: [debug]
        profiles:
          exporters: [debug]

# CPU: requests are close to what each service used under 50 load-generator users; limits leave room
# for startup, which needs far more than steady state for the JVM (ad, fraud-detection, kafka) and .NET
# (accounting, cart) services. Memory limits are the chart's. Without requests, Kubernetes would
# reserve the full limits. flagd-ui keeps the chart's settings: it's defined in a list, which Helm
# can't merge into.
components:
  agent:
    enabled: false
  chatbot:
    enabled: false
  mcp:
    enabled: false
  telemetry-docs:
    enabled: false
  opamp-server:
    enabled: false

  ad:
    resources:
      requests: { cpu: 20m }
      limits: { cpu: 1000m }
  astronomy-db:
    resources:
      requests: { cpu: 20m }
      limits: { cpu: 500m }
  currency:
    resources:
      requests: { cpu: 10m }
      limits: { cpu: 200m }
  email:
    resources:
      requests: { cpu: 10m }
      limits: { cpu: 200m }
  frontend:
    resources:
      requests: { cpu: 50m }
      limits: { cpu: 500m }
  frontend-proxy:
    resources:
      requests: { cpu: 20m }
      limits: { cpu: 300m }
  image-provider:
    resources:
      requests: { cpu: 10m }
      limits: { cpu: 200m }
  kafka:
    resources:
      requests: { cpu: 30m }
      limits: { cpu: 1000m }
  payment:
    resources:
      requests: { cpu: 10m }
      limits: { cpu: 300m }
  quote:
    resources:
      requests: { cpu: 10m }
      limits: { cpu: 200m }
  recommendation:
    resources:
      requests: { cpu: 20m }
      limits: { cpu: 300m }
  valkey-cart:
    resources:
      requests: { cpu: 10m }
      limits: { cpu: 200m }

  # HTTP users only: the headless-browser users need far more memory.
  load-generator:
    envOverrides:
      - name: LOCUST_BROWSER_TRAFFIC_ENABLED
        value: "false"
      - name: LOCUST_USERS
        value: "10"
    resources:
      requests: { cpu: 60m }
      limits: { cpu: 500m, memory: 512Mi }

  # The chart's init containers use busybox:latest; these are the same, pinned.
  accounting:
    resources:
      requests: { cpu: 20m }
      limits: { cpu: 500m }
    initContainers:
      - name: wait-for-kafka
        image: busybox:1.38.0
        command: ["sh", "-c", "until nc -z -v -w30 kafka 9092; do echo waiting for kafka; sleep 2; done;"]
  cart:
    resources:
      requests: { cpu: 20m }
      limits: { cpu: 500m }
    initContainers:
      - name: wait-for-valkey-cart
        image: busybox:1.38.0
        command: ["sh", "-c", "until nc -z -v -w30 valkey-cart 6379; do echo waiting for valkey-cart; sleep 2; done;"]
  checkout:
    resources:
      requests: { cpu: 40m }
      limits: { cpu: 300m }
    initContainers:
      - name: wait-for-kafka
        image: busybox:1.38.0
        command: ["sh", "-c", "until nc -z -v -w30 kafka 9092; do echo waiting for kafka; sleep 2; done;"]
  fraud-detection:
    resources:
      requests: { cpu: 20m }
      limits: { cpu: 1000m }
    initContainers:
      - name: wait-for-kafka
        image: busybox:1.38.0
        command: ["sh", "-c", "until nc -z -v -w30 kafka 9092; do echo waiting for kafka; sleep 2; done;"]
  product-catalog:
    resources:
      requests: { cpu: 100m }
      limits: { cpu: 500m }
    initContainers:
      - name: wait-for-astronomy-db
        image: busybox:1.38.0
        command: ["sh", "-c", "until nc -z -v -w30 astronomy-db 5432; do echo waiting for astronomy-db; sleep 2; done;"]
  shipping:
    resources:
      requests: { cpu: 10m }
      limits: { cpu: 200m }
    initContainers:
      - name: wait-for-flagd
        image: busybox:1.38.0
        command: ["sh", "-c", "until nc -z -v -w30 flagd 8013; do echo waiting for flagd; sleep 2; done;"]
  # Capped so a runaway flagd can't starve the node, as one did after a restart.
  flagd:
    resources:
      requests: { cpu: 10m }
      limits: { cpu: 300m }
    initContainers:
      - name: init-config
        image: busybox:1.38.0
        command: ["sh", "-c", "cp /config-ro/demo.flagd.json /config-rw/demo.flagd.json && cat /config-rw/demo.flagd.json"]
        volumeMounts:
          - mountPath: /config-ro
            name: config-ro
          - mountPath: /config-rw
            name: config-rw
