# Demo workload for generating traffic for Caretta to map:
#   loadgen (curl) -> frontend (nginx) -> api (nginx + Postgres client) -> postgres
#
# Usage:
#   kubectl create namespace demo-shop
#   kubectl -n demo-shop create secret generic postgres-auth --from-literal=password="$(openssl rand -hex 24)"
#   kubectl apply -f examples/demo-shop.yaml
#
# Cleanup:
#   kubectl delete namespace demo-shop
apiVersion: v1
kind: Namespace
metadata:
  name: demo-shop
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-conf
  namespace: demo-shop
data:
  frontend.conf: |
    server {
      listen 8080;
      location = /healthz { return 200 "ok\n"; }
      location / { default_type text/plain; return 200 "demo-shop frontend\n"; }
      location /api/ { proxy_pass http://api:8080/; }
    }
  api.conf: |
    server {
      listen 8080;
      location = /healthz { return 200 "ok\n"; }
      location / { default_type application/json; return 200 '{"orders":"see postgres"}\n'; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: demo-shop
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: docker.io/library/postgres:18.6-alpine3.24
          ports: [{ containerPort: 5432, name: postgres }]
          env:
            - { name: POSTGRES_USER, value: shop }
            - { name: POSTGRES_DB, value: shop }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-auth, key: password } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe:
            exec: { command: [pg_isready, -U, shop, -d, shop] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: [pg_isready, -U, shop, -d, shop] }
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql }
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: data, emptyDir: {} }
        - { name: run, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: demo-shop
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: postgres, name: postgres }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: demo-shop
spec:
  replicas: 2
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: nginx
          image: docker.io/nginxinc/nginx-unprivileged:1.31.6-alpine3.24
          ports: [{ containerPort: 8080, name: http }]
          securityContext:
            runAsUser: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          volumeMounts:
            - { name: conf, mountPath: /etc/nginx/conf.d/default.conf, subPath: api.conf }
            - { name: tmp, mountPath: /tmp }
        # Stands in for the API's database access: inserts and reads an order every 2s.
        - name: db-client
          image: docker.io/library/postgres:18.6-alpine3.24
          command:
            - sh
            - -c
            - |
              until pg_isready -q; do sleep 1; done
              psql -qc 'CREATE TABLE IF NOT EXISTS orders (id serial PRIMARY KEY, created timestamptz DEFAULT now())'
              while true; do
                psql -qc 'INSERT INTO orders DEFAULT VALUES; SELECT count(*) FROM orders;' >/dev/null
                sleep 2
              done
          env:
            - { name: PGHOST, value: postgres }
            - { name: PGUSER, value: shop }
            - { name: PGDATABASE, value: shop }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: postgres-auth, key: password } }
          securityContext:
            runAsUser: 70
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          livenessProbe:
            exec: { command: [pg_isready, -q] }
            periodSeconds: 30
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
      volumes:
        - { name: conf, configMap: { name: nginx-conf } }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: demo-shop
spec:
  selector: { app: api }
  ports: [{ port: 8080, targetPort: http, name: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: demo-shop
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: nginx
          image: docker.io/nginxinc/nginx-unprivileged:1.31.6-alpine3.24
          ports: [{ containerPort: 8080, name: http }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          volumeMounts:
            - { name: conf, mountPath: /etc/nginx/conf.d/default.conf, subPath: frontend.conf }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: conf, configMap: { name: nginx-conf } }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: demo-shop
spec:
  selector: { app: frontend }
  ports: [{ port: 80, targetPort: http, name: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: demo-shop
spec:
  replicas: 1
  selector:
    matchLabels: { app: loadgen }
  template:
    metadata:
      labels: { app: loadgen }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: curl
          image: docker.io/curlimages/curl:8.22.0
          command:
            - sh
            - -c
            - |
              while true; do
                curl -fsS -o /dev/null http://frontend/
                curl -fsS -o /dev/null http://frontend/api/orders
                sleep 1
              done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          livenessProbe:
            exec: { command: [curl, -fsS, -o, /dev/null, http://frontend/healthz] }
            periodSeconds: 30
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 32Mi }
