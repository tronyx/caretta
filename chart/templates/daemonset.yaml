apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "caretta.name" . }}
  labels:
    app: caretta
    {{- include "caretta.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: caretta
      {{- include "caretta.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
    {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
    {{- end }}
      labels:
        app: caretta
        {{- include "caretta.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "caretta.name" . }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # Must exceed the app's 20s internal shutdown timeout.
      terminationGracePeriodSeconds: 30
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          volumeMounts:
            - mountPath: /sys/kernel/tracing
              name: tracefs
              readOnly: true
          ports:
            - name: prom-metrics
              containerPort: {{ .Values.prometheusPort }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /readyz
              port: prom-metrics
            periodSeconds: 5
            # Up to 5 minutes for the initial cluster snapshot on large clusters plus BPF load.
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: prom-metrics
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: prom-metrics
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          env:
            - name: "RESOLVE_DNS"
              value: "{{ .Values.enableDnsResolving }}"
            - name: "PROMETHEUS_PORT"
              value: "{{ .Values.prometheusPort }}"
            - name: "PROMETHEUS_ENDPOINT"
              value: "{{ .Values.prometheusEndpoint }}"
            - name: "POLL_INTERVAL"
              value: "{{ .Values.pollIntervalSeconds }}"
            - name: "TRAVERSE_UP_HIERARCHY"
              value: "{{ .Values.traverseUpHierarchy }}"
            - name: "LINK_TTL"
              value: {{ .Values.linkTTL | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: tracefs
          hostPath:
            path: {{ .Values.tracefsPath }}
            type: Directory