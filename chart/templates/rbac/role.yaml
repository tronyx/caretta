apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "caretta.fullname" . }}
rules:
{{- if and .Values.rbac.sccEnabled (.Capabilities.APIVersions.Has "security.openshift.io/v1")}}
  - apiGroups:
    - security.openshift.io
    resources:
    - securitycontextconstraints
    verbs:
    - use
    resourceNames:
    - privileged
{{- end }}
  # Exactly what the resolver's informers read: list and watch only, no get, no ConfigMaps, Secrets or logs.
  - apiGroups:
      - ''
    resources:
      - pods
      - nodes
      - services
    verbs:
      - list
      - watch
  - apiGroups:
      - apps
    resources:
      - replicasets
      - daemonsets
      - statefulsets
      - deployments
    verbs:
      - list
      - watch
  - apiGroups:
      - batch
    resources:
      - jobs
      - cronjobs
    verbs:
      - list
      - watch

