suite: RBAC and service account
templates:
  - templates/rbac/role.yaml
  - templates/rbac/rolebinding.yaml
  - templates/rbac/serviceaccount.yaml
tests:
  - it: only lists and watches the objects the resolver reads
    template: templates/rbac/role.yaml
    asserts:
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: [pods, nodes, services]
              verbs: [list, watch]
            - apiGroups: [apps]
              resources: [replicasets, daemonsets, statefulsets, deployments]
              verbs: [list, watch]
            - apiGroups: [batch]
              resources: [jobs, cronjobs]
              verbs: [list, watch]

  - it: adds the OpenShift SCC rule only on OpenShift
    template: templates/rbac/role.yaml
    capabilities:
      apiVersions:
        - security.openshift.io/v1
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [security.openshift.io]
            resources: [securitycontextconstraints]
            verbs: [use]
            resourceNames: [privileged]

  - it: leaves the SCC rule out on OpenShift when sccEnabled is false
    template: templates/rbac/role.yaml
    capabilities:
      apiVersions:
        - security.openshift.io/v1
    set:
      rbac.sccEnabled: false
    asserts:
      - lengthEqual:
          path: rules
          count: 3

  - it: binds the role to the service account in the release's namespace
    template: templates/rbac/rolebinding.yaml
    release:
      namespace: monitoring
    asserts:
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: caretta
              namespace: monitoring

  - it: creates the service account with its annotations
    template: templates/rbac/serviceaccount.yaml
    set:
      serviceAccount.annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/caretta
    asserts:
      - equal:
          path: metadata.name
          value: caretta
      - equal:
          path: metadata.annotations
          value:
            eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/caretta

  - it: uses a custom service account name everywhere
    set:
      serviceAccount.name: custom-sa
    asserts:
      - equal:
          path: metadata.name
          value: custom-sa
        template: templates/rbac/serviceaccount.yaml
      - equal:
          path: subjects[0].name
          value: custom-sa
        template: templates/rbac/rolebinding.yaml

  - it: doesn't create a service account when using an existing one
    template: templates/rbac/serviceaccount.yaml
    set:
      serviceAccount.create: false
      serviceAccount.name: existing
    asserts:
      - hasDocuments:
          count: 0

  - it: binds the role to the existing service account
    template: templates/rbac/rolebinding.yaml
    set:
      serviceAccount.create: false
      serviceAccount.name: existing
    asserts:
      - equal:
          path: subjects[0].name
          value: existing
