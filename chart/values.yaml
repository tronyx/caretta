enableDnsResolving: true
prometheusPort: 7117
prometheusEndpoint: "/metrics"
pollIntervalSeconds: 5
traverseUpHierarchy: true
# Drop a link from the metrics once it hasn't been seen for this long (Go duration); "0" keeps links forever.
linkTTL: 1h
# Connections tracked per node. The kernel reserves memory for all of them up front, counted against
# resources.limits.memory: about 192 MiB at 1,000,000, scaling linearly.
maxConnections: 1000000
# Go's soft memory limit. Keep it below resources.limits.memory minus the maxConnections memory above.
goMemLimit: 256MiB
# Log format: json (one JSON object per line, for log collectors) or text.
logFormat: json

rbac:
  sccEnabled: true
image:
  # Also published as docker.io/tronyx/caretta
  repository: ghcr.io/tronyx/caretta
  pullPolicy: IfNotPresent
  # Defaults to the chart appVersion; never use "latest"
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 10m
    memory: 256Mi

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

# Root is required to attach kprobes/tracepoints, so lock it down to the minimum capabilities instead.
securityContext:
  privileged: false
  runAsUser: 0
  runAsNonRoot: false
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
    # SYS_RESOURCE is only needed on kernels < 5.11; replace BPF/PERFMON with SYS_ADMIN on kernels < 5.8
    add:
      - BPF
      - PERFMON
      - SYS_RESOURCE

# Host tracefs mount used to resolve tracepoint IDs
tracefsPath: /sys/kernel/tracing

tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  - key: node-role.kubernetes.io/master
    operator: Exists
    effect: NoSchedule

nodeSelector: {}
affinity: {}
priorityClassName:

victoria-metrics-single:
  server:
    image:
      registry: docker.io
      repository: victoriametrics/victoria-metrics
      tag: v1.153.0
    resources:
      limits:
        cpu: 300m
        memory: 350Mi
      requests:
        cpu: 5m
        memory: 96Mi
    fullnameOverride: caretta-vm
    podSecurityContext:
      enabled: true
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      fsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      enabled: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    persistentVolume:
       enabled: false
       size: 16Gi # change enabled to true if you pv is required

    scrape:
      enabled: true

      config:
        global:
          scrape_interval: 15s

        scrape_configs:
          - job_name:       'caretta'
            metrics_path: /metrics
            scrape_interval: 5s
            kubernetes_sd_configs:
            - role: pod
              namespaces:
                own_namespace: true
            relabel_configs:
              - source_labels: [__meta_kubernetes_pod_label_app]
                separator: ;
                regex: caretta
                replacement: $1
                action: keep
              - action: labelmap
                regex: __meta_kubernetes_pod_label_(.+)
              - source_labels: [__meta_kubernetes_pod_name]
                action: replace
                target_label: caretta_pod
              - source_labels: [__meta_kubernetes_pod_node_name]
                action: replace
                target_label: caretta_node

grafana:
  image:
    registry: docker.io
    repository: grafana/grafana
    tag: 13.2.3-distroless
  testFramework:
    image:
      registry: docker.io
      repository: bats/bats
      tag: 1.14.0
  initChownData:
    image:
      registry: docker.io
      repository: library/busybox
      tag: 1.38.0
  downloadDashboardsImage:
    registry: docker.io
    repository: curlimages/curl
    tag: 8.22.0
  imageRenderer:
    image:
      registry: docker.io
      repository: grafana/grafana-image-renderer
      tag: v5.12.5
  resources:
    limits:
      memory: 512Mi
      cpu: 300m
    requests:
      memory: 320Mi
      cpu: 25m
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: "http://caretta-vm:8428"
        editable: "true"

  sidecar:
    image:
      registry: quay.io
      repository: kiwigrid/k8s-sidecar
      tag: 2.14.1
    dashboards:
      label: grafana_dashboard
      labelValue: ""

  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: true

  dashboardsConfigMaps:
    default: "caretta-grafana-dashboards"

  grafana.ini:
    # Set enabled to true to let anyone who can reach Grafana view dashboards without logging in.
    auth.anonymous:
      enabled: false
    dashboards:
      default_home_dashboard_path: /var/lib/grafana/dashboards/default/dashboard.json
  adminUser: "admin"
  # No adminPassword: a random one is generated into the caretta-grafana Secret and kept across upgrades.
  # To use your own Secret instead, set admin.existingSecret.
