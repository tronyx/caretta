name: release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      packages: write
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Build & Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/tronyx/caretta:${{ github.ref_name }}
            docker.io/tronyx/caretta:${{ github.ref_name }}
          platforms: linux/arm64,linux/amd64
      -
        name: Publish Chart
        env:
          GITHUB_TAG: ${{ github.ref_name }}
        run: |
          version=${GITHUB_TAG#v}
          helm lint chart
          helm package --version "${version}" --app-version "${GITHUB_TAG}" chart
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "caretta-${version}.tgz" oci://ghcr.io/tronyx/charts
