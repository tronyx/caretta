name: release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      packages: write
    env:
      # The same pin as in pr.yaml; update by hand
      TRIVY: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Build the amd64 image to scan
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          cache-from: type=gha
          tags: caretta:scan
      -
        # A release with a fixable critical vulnerability isn't published
        name: Scan for vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$RUNNER_TEMP:/out" "$TRIVY" image --image-src docker \
            --scanners vuln --ignore-unfixed --format json --output /out/trivy.json caretta:scan
          docker run --rm -v "$RUNNER_TEMP:/out" "$TRIVY" convert --format table /out/trivy.json
          docker run --rm -v "$RUNNER_TEMP:/out" "$TRIVY" convert --quiet --format table \
            --severity CRITICAL --exit-code 1 /out/trivy.json
      -
        name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        # No floating major tag exists; Dependabot updates the commit and the version comment
        name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      -
        name: Build & Push Docker Image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/tronyx/caretta:${{ github.ref_name }}
            docker.io/tronyx/caretta:${{ github.ref_name }}
          platforms: linux/arm64,linux/amd64
          provenance: mode=max
          sbom: true
      -
        # Keyless: the signature names this workflow and tag, from GitHub's OIDC token. Both registries hold the same digest.
        name: Sign the images
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/tronyx/caretta@${DIGEST}" "docker.io/tronyx/caretta@${DIGEST}"
      -
        name: Publish and sign the chart
        env:
          GITHUB_TAG: ${{ github.ref_name }}
        run: |
          set -o pipefail
          version=${GITHUB_TAG#v}
          helm lint chart
          helm package --version "${version}" --app-version "${GITHUB_TAG}" chart
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "caretta-${version}.tgz" oci://ghcr.io/tronyx/charts 2>&1 | tee "$RUNNER_TEMP/helm-push.txt"
          digest=$(awk '/^Digest:/ {print $2}' "$RUNNER_TEMP/helm-push.txt")
          if [ -z "$digest" ]; then
            echo "::error::helm push printed no digest"
            exit 1
          fi
          cosign sign --yes "ghcr.io/tronyx/charts/caretta@${digest}"
      -
        # The notes are the release's section of CHANGELOG.md, up to the next version's heading
        name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TAG: ${{ github.ref_name }}
        run: |
          awk -v tag="$GITHUB_TAG" '
            /^## / { if (found) exit; if (index($0, "[" tag "]")) { found = 1; next } }
            found
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::error::CHANGELOG.md has no section for $GITHUB_TAG"
            exit 1
          fi
          gh release create "$GITHUB_TAG" --title "$GITHUB_TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
