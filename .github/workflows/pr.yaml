name: build

on:
  pull_request:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: gofmt, go vet and go test -race
        uses: docker/build-push-action@v7
        with:
          context: .
          target: test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      -
        # Also fails if a subchart's archive in chart/charts doesn't match Chart.yaml
        name: Lint the chart
        run: helm lint chart
      -
        # chart/tests; pinned to its digest, update by hand (Dependabot doesn't update images run this way).
        # Runs as the runner's user so it can write to the checkout.
        name: Test the chart
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD/chart:/apps" \
            helmunittest/helm-unittest:4.3.0-1.2.1@sha256:28ea86c3e0b07f501f0c2e9c08b9f41e240f4a4b571cb5106b36cf0f0607e989 .
      -
        # The README, the changelog and everything in .github, with the settings in .markdownlint.json.
        # Pinned to a commit since a tag can be moved; Dependabot updates the commit and the version comment.
        name: Lint the Markdown files
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"

  ebpf:
    name: eBPF on the ${{ matrix.arch }} kernel
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Build the integration tests
        uses: docker/build-push-action@v7
        with:
          context: .
          target: integration-test
          platforms: linux/${{ matrix.arch }}
          outputs: type=local,dest=${{ runner.temp }}/integration
          cache-from: type=gha
      -
        name: Show the kernel
        run: uname -srm && ls -l /sys/kernel/btf/vmlinux
      -
        # Loads the real programs into the runner's kernel and checks what they record for real TCP connections
        name: Run the integration tests as root
        run: sudo "$RUNNER_TEMP/integration/caretta-integration.test" -test.v -test.count=1

  e2e:
    name: End-to-end on kind
    needs: [test, ebpf]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          cache-from: type=gha
          tags: caretta:e2e
      -
        name: Create a kind cluster
        uses: helm/kind-action@v1.15.1
        with:
          cluster_name: caretta-e2e
      -
        name: Load the image into the cluster
        run: kind load docker-image caretta:e2e --name caretta-e2e
      -
        # Installs the chart, runs the demo app, and checks the service map, Grafana and a clean shutdown
        name: Run the end-to-end tests
        env:
          IMAGE_REPOSITORY: caretta
          IMAGE_TAG: e2e
        run: scripts/e2e.sh

  build:
    needs: [test, ebpf, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/develop' }}
      # Pinned to its digest; Dependabot doesn't update images run this way, so update it by hand
      TRIVY: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Set image tag
        id: tag
        run: echo "tag=develop-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        # Both architectures hold the same packages and binary dependencies, so one scan covers them
        name: Build the amd64 image to scan
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          cache-from: type=gha
          tags: caretta:scan
      -
        name: Scan for vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$RUNNER_TEMP:/out" "$TRIVY" image --image-src docker \
            --scanners vuln --ignore-unfixed --format json --output /out/trivy.json caretta:scan
          docker run --rm -v "$RUNNER_TEMP:/out" "$TRIVY" convert --format table /out/trivy.json
          docker run --rm -v "$RUNNER_TEMP:/out" "$TRIVY" convert --format sarif --output /out/trivy.sarif /out/trivy.json
      -
        # Pull requests from forks can't write to the Security tab; their results are in the log above
        name: Upload the scan to the Security tab
        if: env.PUBLISH == 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ runner.temp }}/trivy.sarif
          category: trivy-amd64
      -
        name: Fail on fixable critical vulnerabilities
        run: |
          docker run --rm -v "$RUNNER_TEMP:/out" "$TRIVY" convert --quiet --format table \
            --severity CRITICAL --exit-code 1 /out/trivy.json
      -
        name: Login to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Login to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Build Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/tronyx/caretta:${{ steps.tag.outputs.tag }}
            docker.io/tronyx/caretta:${{ steps.tag.outputs.tag }}
          platforms: linux/amd64,linux/arm64

